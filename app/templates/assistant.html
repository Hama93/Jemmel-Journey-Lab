{% extends "base.html" %}

{% block title %}
Tourism AI Assistant
{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-3">Tourism AI Assistant</h2>
    <p>Ask about attractions, itinerary ideas, and budget-friendly options.</p>

    <div class="row g-2 mb-3">
        <div class="col-md-3">
            <input id="city" class="form-control" placeholder="City (optional)">
        </div>
        <div class="col-md-3">
            <input id="budget" class="form-control" type="number" min="0" step="0.01" placeholder="Budget max (optional)">
        </div>
    </div>

    <div class="mb-3">
        <textarea id="message" class="form-control" rows="4" placeholder="Example: Build me a budget itinerary in Sousse"></textarea>
    </div>
    <button id="ask-btn" class="btn btn-primary">Ask Assistant</button>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Answer</h5>
            <pre id="assistant-reply" style="white-space: pre-wrap; margin: 0;"></pre>
        </div>
    </div>
</div>

<script>
document.getElementById('ask-btn').addEventListener('click', async () => {
    const message = document.getElementById('message').value;
    const city = document.getElementById('city').value;
    const budget = document.getElementById('budget').value;
    const replyBox = document.getElementById('assistant-reply');

    replyBox.textContent = 'Thinking...';

    const response = await fetch('{{ url_for("main.assistant_chat") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, city, budget })
    });

    const data = await response.json();
    replyBox.textContent = data.reply || 'No response.';
});
</script>
{% endblock %}
